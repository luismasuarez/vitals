name: Release

# Everything lives in one workflow on purpose: a tag or a release created by
# release-please with the default GITHUB_TOKEN does not trigger another
# workflow run, so the build jobs must run in the same run as the release job,
# gated on its `release_created` output.
on:
  push:
    branches:
      - main
  # Recovery path: rebuild the artifacts for a release that already exists
  # (for example after a failed APK build), without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and re-upload assets for, e.g. v0.3.2"
        required: true
        type: string

# Least privilege by default; each job opts into what it needs.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens or updates `chore(release): X.Y.Z`: CHANGELOG.md, Cargo.toml,
      # Cargo.lock and the Android version name. Merging it creates the tag
      # and the GitHub Release; this same run then builds the artifacts.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  meta:
    name: Resolve version
    needs: release-please
    # A merged release PR, or a manual re-run for an existing tag.
    if: needs.release-please.outputs.released == 'true' || inputs.tag != ''
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Derive version and Android versionCode
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag || needs.release-please.outputs.tag }}
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${version}', expected X.Y.Z"
            exit 1
          fi

          IFS=. read -r major minor patch <<< "${version}"
          # Keep published codes above the local 303/304 test installs.
          code=$(( major * 10000 + minor * 100 + patch + 3 ))

          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "version_code=${code}"
          } >> "${GITHUB_OUTPUT}"

  server:
    name: Server (${{ matrix.target }})
    needs: meta
    # aarch64 builds natively on an arm runner: cross + QEMU fails inside the
    # container when a build script needs a newer glibc than the image ships.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: "true"
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            cross: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true

      - name: Install cross
        if: matrix.cross == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install musl toolchain
        if: matrix.cross == 'false'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Build static binary (cross)
        if: matrix.cross == 'true'
        run: cross build --locked --release --target "${{ matrix.target }}"

      - name: Build static binary (native)
        if: matrix.cross == 'false'
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Strip binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/vitals"
          test -f "${bin}"
          # Copy first: cross may leave the target dir owned by root, and we
          # only need the stripped binary for packaging.
          staged="${RUNNER_TEMP}/vitals-${TARGET}"
          cp "${bin}" "${staged}"
          if [[ "${TARGET}" == aarch64-* && "$(uname -m)" != "aarch64" ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip -s "${staged}"
          else
            strip -s "${staged}"
          fi
          file "${staged}"

      - name: Package tarball
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="vitals-${VERSION}-${TARGET}"
          mkdir -p "dist/${name}"
          install -m 0755 "${RUNNER_TEMP}/vitals-${TARGET}" "dist/${name}/vitals"
          install -m 0644 deploy/vitals.service "dist/${name}/vitals.service"
          install -m 0644 deploy/config.toml.example "dist/${name}/config.toml.example"
          install -m 0644 README.md "dist/${name}/README.md"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          rm -rf "dist/${name}"

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/vitals-${{ needs.meta.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  android:
    name: Android APK
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner already ships an Android SDK; the setup-android action tries
      # to install the legacy "tools" package and fails. Use the SDK directly.
      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "${sdk}" ]]; then
            echo "::error::no Android SDK found at ${sdk}"
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=${sdk}" >> "${GITHUB_ENV}"
          echo "ANDROID_HOME=${sdk}" >> "${GITHUB_ENV}"
          sdkmanager="$(ls -d "${sdk}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n1 || true)"
          if [[ -n "${sdkmanager}" ]]; then
            yes | "${sdkmanager}" --licenses >/dev/null 2>&1 || true
            "${sdkmanager}" --install "platforms;android-35" "build-tools;35.0.0" >/dev/null 2>&1 || true
          fi
          ls "${sdk}/platforms" "${sdk}/build-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ANDROID_KEYSTORE_BASE64}" \
             && -n "${ANDROID_KEYSTORE_PASSWORD}" \
             && -n "${ANDROID_KEY_ALIAS}" \
             && -n "${ANDROID_KEY_PASSWORD}" ]]; then
            keystore="${RUNNER_TEMP}/vitals-release.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
            echo "keystore=${keystore}" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Signing secrets are missing; building an unsigned debug APK."
            echo "signed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd app
          gradle_cmd="gradle"
          if [[ -x ./gradlew ]]; then
            gradle_cmd="./gradlew"
          fi
          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            "${gradle_cmd}" assembleRelease \
              -PvitalsVersionName="${VERSION}" \
              -PvitalsVersionCode="${VERSION_CODE}"
          else
            "${gradle_cmd}" assembleDebug \
              -PvitalsVersionName="${VERSION}" \
              -PvitalsVersionCode="${VERSION_CODE}"
          fi

      - name: Sign and collect APK
        shell: bash
        env:
          KEYSTORE: ${{ steps.signing.outputs.keystore }}
        run: |
          set -euo pipefail
          mkdir -p dist

          if [[ "${{ steps.signing.outputs.signed }}" == "true" ]]; then
            build_tools="$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* 2>/dev/null | sort -V | tail -n1)"
            if [[ -z "${build_tools}" ]]; then
              echo "::error::no build-tools in ${ANDROID_SDK_ROOT}"
              exit 1
            fi
            export PATH="${build_tools}:${PATH}"

            apk="app/build/outputs/apk/release/vitals-app-release.apk"
            if [[ ! -f "${apk}" ]]; then
              apk="app/build/outputs/apk/release/vitals-app-release-unsigned.apk"
            fi
            test -f "${apk}" || { echo "::error::release APK not found"; exit 1; }

            # Align, then sign with the decoded keystore. Passwords are read
            # from the environment so they never appear in the process list.
            zipalign -f -p 4 "${apk}" "${RUNNER_TEMP}/app-aligned.apk"
            apksigner sign \
              --ks "${KEYSTORE}" \
              --ks-key-alias "${ANDROID_KEY_ALIAS}" \
              --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
              --key-pass env:ANDROID_KEY_PASSWORD \
              --out "dist/vitals-${VERSION}-android.apk" \
              "${RUNNER_TEMP}/app-aligned.apk"
            apksigner verify --print-certs "dist/vitals-${VERSION}-android.apk"
          else
            apk="app/build/outputs/apk/debug/vitals-app-debug.apk"
            test -f "${apk}" || { echo "::error::debug APK not found"; exit 1; }
            install -m 0644 "${apk}" "dist/vitals-${VERSION}-android-debug.apk"
          fi

          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Upload assets to the release
    needs: [release-please, meta, server, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lh dist

      - name: Upload assets and extend the release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          apk="$(find dist -maxdepth 1 -name 'vitals-*-android*.apk' | head -n1)"
          test -n "${apk}" || { echo "::error::APK asset not found"; exit 1; }
          apk_name="$(basename "${apk}")"
          x86="vitals-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          arm="vitals-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
          base="https://github.com/${REPO}/releases/download/${TAG}"

          (
            cd dist
            sha256sum ./*.tar.gz ./*.apk > SHA256SUMS
            cat SHA256SUMS
          )

          # release-please already wrote the changelog as the release notes:
          # keep it at the end, after the download and install sections.
          changelog="$(gh release view "${TAG}" --repo "${REPO}" --json body -q .body)"

          {
            echo "## Descargas"
            echo
            echo "| Plataforma | Archivo |"
            echo "|---|---|"
            echo "| Linux x86_64 (musl) | [\`${x86}\`](${base}/${x86}) |"
            echo "| Linux aarch64 (musl) | [\`${arm}\`](${base}/${arm}) |"
            echo "| Android | [\`${apk_name}\`](${base}/${apk_name}) |"
            echo
            echo "Verifica los archivos con [\`SHA256SUMS\`](${base}/SHA256SUMS): \`sha256sum -c SHA256SUMS\`."
            echo
            if [[ "${apk_name}" == *-debug.apk ]]; then
              echo "> **Aviso:** el APK se compiló como *debug* porque este repositorio no tiene"
              echo "> configurados los secrets de firma. No está firmado para producción;"
              echo "> instálalo solo para pruebas."
              echo
            fi
            echo "## Instalación del servidor"
            echo
            echo '```bash'
            echo "curl -LO ${base}/${x86}"
            echo "tar xzf ${x86}"
            echo "sudo install -m 0755 vitals-${VERSION}-x86_64-unknown-linux-musl/vitals /usr/local/bin/vitals"
            echo "sudo install -m 0644 vitals-${VERSION}-x86_64-unknown-linux-musl/vitals.service /etc/systemd/system/vitals.service"
            echo "sudo install -d /etc/vitals"
            echo "sudo install -m 0644 vitals-${VERSION}-x86_64-unknown-linux-musl/config.toml.example /etc/vitals/config.toml"
            echo "sudo systemctl daemon-reload && sudo systemctl enable --now vitals"
            echo '```'
            echo
            echo "El servidor escucha en el puerto 8443. Empareja el móvil con \`sudo vitals pair --name <nombre>\`."
            echo "En ARM64 sustituye \`x86_64\` por \`aarch64\` en los nombres de archivo."
            echo
            echo "## Instalación del APK"
            echo
            echo '```bash'
            echo "adb install -r ${apk_name}"
            echo '```'
            echo
            echo "También puedes descargar el APK en el móvil y abrirlo (requiere permitir la"
            echo "instalación desde orígenes desconocidos)."
            echo
            echo "## Cambios"
            echo
            printf '%s\n' "${changelog}"
          } > "${RUNNER_TEMP}/release-body.md"

          gh release upload "${TAG}" \
            --repo "${REPO}" \
            --clobber \
            dist/*.tar.gz dist/*.apk dist/SHA256SUMS

          gh release edit "${TAG}" \
            --repo "${REPO}" \
            --notes-file "${RUNNER_TEMP}/release-body.md"
