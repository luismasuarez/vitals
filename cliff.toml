# git-cliff configuration for vitals.
#
# Commit grouping follows the Conventional Commits types used in this repo.
# Section headings are Spanish (user-facing prose); each entry keeps the
# original English commit message unchanged.
#
# Regenerate the changelog with ./scripts/release.sh <version> or manually:
#   git-cliff --tag vX.Y.Z --output CHANGELOG.md
#
# Links use the TU_USUARIO/vitals placeholder. scripts/release.sh and the
# release workflow replace it with the real owner/repo (from the git remote
# and GITHUB_REPOSITORY respectively) after rendering.

[changelog]
header = """
# Changelog

Todos los cambios notables de este proyecto se documentan en este archivo.
El contenido se genera con [git-cliff](https://git-cliff.org) a partir de los
commits convencionales; no lo edites a mano. Para publicar una versión y
regenerar este archivo, ejecuta `./scripts/release.sh X.Y.Z`.

"""
# Lines ending in a backslash use TOML line folding: the tag lines leave no
# whitespace in the output, and the blank lines below are deliberate.
body = """
{% set groups = ["Añadido", "Corregido", "Rendimiento", "Cambios internos", "Documentación", "Build y CI", "Pruebas", "Otros"] %}\
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/TU_USUARIO/vitals{% if previous and previous.version %}/compare/{{ previous.version }}...{{ version }}{% else %}/releases/tag/{{ version }}{% endif %}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group in groups %}\
{% set entries = commits | filter(attribute="group", value=group) %}\
{% if entries | length > 0 %}
### {{ group }}

{% for commit in entries %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message }}{% if commit.breaking %} **BREAKING**{% endif %}
{% endfor %}\
{% endif %}\
{% endfor %}\n\n"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
# Drop commits that cannot be parsed as conventional commits (e.g. plain merges).
filter_unconventional = true
# Drop commits that ended up without a group after parsing.
filter_commits = true
split_commits = false
protect_breaking_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"

# Order matters: the first matching parser wins unless `continue = true`.
commit_parsers = [
  # Noise that must never reach the user-facing changelog.
  { message = '^chore\(deps', skip = true },
  { message = '^chore\(release\)', skip = true },
  { message = '^Merge', skip = true },

  # User-facing groups.
  { message = '^feat', group = "Añadido" },
  { message = '^fix', group = "Corregido" },
  { message = '^perf', group = "Rendimiento" },
  { message = '^refactor', group = "Cambios internos" },
  { message = '^style', group = "Cambios internos" },
  { message = '^docs', group = "Documentación" },
  { message = '^build', group = "Build y CI" },
  { message = '^ci', group = "Build y CI" },
  { message = '^test', group = "Pruebas" },
  { message = '^chore', group = "Otros" },
  { message = '^revert', group = "Otros" },
]
